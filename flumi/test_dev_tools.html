<!DOCTYPE html>
<html>
<head>
    <title>Dev Tools Test Page</title>
    <style>
        .container { padding: 20px; background: #f0f0f0; }
        .header { color: blue; font-size: 24px; }
        .content { margin: 10px 0; }
        .button { background: #007bff; color: white; padding: 10px; border: none; cursor: pointer; }
        .button:hover { background: #0056b3; }
        #dynamic-content { border: 2px solid green; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header">Dev Tools Test Page</h1>
        <div class="content">
            <p>This is a test page for the Elements dev tools.</p>
            <p>Click the button below to add dynamic content:</p>
            <button class="button" onclick="addContent()">Add Dynamic Content</button>
            <div id="dynamic-content"></div>
        </div>
        <div class="content">
            <h2>Nested Elements Test</h2>
            <div>
                <span>Inline text with </span>
                <strong>bold text</strong>
                <span> and </span>
                <em>italic text</em>
            </div>
        </div>
    </div>

    <script>
        function addContent() {
            var container = document.getElementById('dynamic-content');
            var newDiv = document.createElement('div');
            newDiv.innerHTML = '<p>Dynamic content added at ' + new Date().toLocaleTimeString() + '</p>';
            container.appendChild(newDiv);
        }
    </script>
</body>
</html>
